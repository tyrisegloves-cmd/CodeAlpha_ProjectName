{% load core_extras %}<article class="post">
<a class="av" style="--h:{{ p.author.username|hue }}" href="{% url 'profile' p.author.username %}">{{ p.author|initial }}</a>
<div class="body"><div class="meta"><a href="{% url 'profile' p.author.username %}"><b>{{ p.author.get_full_name|default:p.author.username }}</b></a>
<span class="muted">@{{ p.author.username }} &middot; <a class="muted" href="{% url 'post_detail' p.pk %}" title="{{ p.created }}">{{ p.created|ago }}</a></span></div>
<p class="text">{{ p.text|linebreaksbr }}</p>
<div class="acts"><button class="like {% if p.id in liked_ids %}on{% endif %}" data-url="{% url 'like' p.pk %}" aria-label="Like">
<svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>{{ p.nlikes }}</span></button>
<a class="cm" href="{% url 'post_detail' p.pk %}" aria-label="Comments"><svg viewBox="0 0 24 24" width="19" height="19"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>{{ p.ncomments }}</a>
{% if p.author == user %}<form method="post" action="{% url 'post_delete' p.pk %}">{% csrf_token %}<button class="link muted">Delete</button></form>{% endif %}</div></div></article>
